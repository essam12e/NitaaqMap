org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend configuration (override per environment, e.g. -Pnitaaq.apiBaseUrl=https://api.example.com/)
# The API host the app calls to create trips.
nitaaq.apiBaseUrl=https://nitaaq-map.vercel.app/
# Comma separated hosts that are allowed to appear in the QR (the temporary /trip/<id> link).
nitaaq.trustedTripHosts=nitaaq-map.vercel.app
# Optional stable public origin for QR links (sent as "siteOrigin" to /api/trips). Empty = server origin.
nitaaq.qrPublicOrigin=
