name: Android app

on:
  pull_request:
    paths:
      - "android-app/**"
      - "lib/**"
      - "tests/**"
      - "app/api/**"
      - "app/trip/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner) + platform 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validator fixtures are in sync with lib/maps-url.ts
        run: |
          node --experimental-strip-types tools/generate-validator-fixtures.mjs
          git diff --exit-code core/src/test/resources/maps_url_cases.json

      - name: Unit tests (core + app/Robolectric)
        run: ./gradlew --no-configuration-cache :core:test :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew --no-configuration-cache :app:lintDebug

      # Exercises the real release signing path with a throwaway key generated on the runner.
      # The resulting release APK can be installed on a phone to test the R8-shrunk build,
      # but it is NOT the key used for Google Play (see android-release.yml).
      - name: Throwaway signing key for CI
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
            -validity 30 -storepass ci-only-pass -keypass ci-only-pass -dname "CN=Nitaaq CI" > /dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=ci-only-pass\nkeyAlias=ci\nkeyPassword=ci-only-pass\n' "$RUNNER_TEMP/ci.jks" > keystore.properties

      - name: Build debug APK, release APK and release AAB
        run: >
          ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease :app:bundleRelease
          -Pnitaaq.versionCode=2 -Pnitaaq.versionName=0.0.0-ci

      - name: Release outputs are signed with the configured key and versioned
        run: |
          rm -f keystore.properties
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=Nitaaq CI"
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -1 | tee /dev/stderr \
            | grep -q "versionCode='2'"

      - name: No server secrets inside the APKs
        run: |
          for apk in $(find app/build/outputs/apk app/build/outputs/bundle -name '*.apk' -o -name '*.aab'); do
            echo "checking $apk"
            if unzip -p "$apk" | grep -a -E "dev-only-change-this-secret|TRIP_TOKEN_SECRET|BEGIN PRIVATE KEY"; then
              echo "::error::secret-like string found in $apk"; exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nitaaq-map-apks
          path: android-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitaaq-map-reports
          path: |
            android-app/core/build/reports/
            android-app/app/build/reports/
          if-no-files-found: ignore

  server-expiry-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Start server with a throwaway secret
        run: |
          echo "TRIP_TOKEN_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          # Android network layer (same Retrofit/OkHttp code as the app) against the live local server.
          # :core is pure JVM, so build it in isolation (no Android SDK needed for this job).
          mkdir -p /tmp/corebuild && cat > /tmp/corebuild/settings.gradle.kts <<EOS
          dependencyResolutionManagement {
              repositories { mavenCentral() }
              versionCatalogs { create("libs") { from(files("$GITHUB_WORKSPACE/android-app/gradle/libs.versions.toml")) } }
          }
          pluginManagement { repositories { mavenCentral(); gradlePluginPortal() } }
          include(":core")
          project(":core").projectDir = file("$GITHUB_WORKSPACE/android-app/core")
          EOS
          touch /tmp/corebuild/build.gradle.kts
          (cd android-app && NITAAQ_E2E_BASE_URL=http://localhost:3000/ ./gradlew -p /tmp/corebuild --no-configuration-cache :core:test --tests '*LiveServerE2ETest*')
          # Finally the real-time check: the same QR must be refused after 5 minutes.
          BASE=http://localhost:3000 node android-app/tools/e2e-server-expiry.mjs --wait-real-ttl
